name: domain-setup
# يضيف النطاق إلى حساب Cloudflare (إن لم يكن مضافًا) ويطبع خوادم الأسماء
# التي يجب وضعها عند المسجّل (Namecheap). يُشغَّل يدويًا فقط.
on:
  workflow_dispatch:
    inputs:
      domain: { description: 'النطاق', required: true, default: 'elkabsula.site' }
jobs:
  zone:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT: 0000e4925fd52a263ae76a9053eade14
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: ${{ inputs.domain }}
    steps:
      - name: Find or create zone
        run: |
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          echo "== token check"; curl -s "${H[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print('::notice::token',d.get('success'),(d.get('result') or {}).get('status'),d.get('errors'))"
          Z=$(curl -s "${H[@]}" "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN")
          echo "$Z" | python3 -c "import sys,json;d=json.load(sys.stdin);print('::notice::lookup',d.get('success'),d.get('errors'),[ (z['name'],z['status'],z.get('name_servers')) for z in d.get('result') or []])"
          N=$(echo "$Z" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('result') or []))")
          if [ "$N" = "0" ]; then
            R=$(curl -s -X POST "${H[@]}" https://api.cloudflare.com/client/v4/zones --data "{\"name\":\"$DOMAIN\",\"account\":{\"id\":\"$CF_ACCOUNT\"},\"type\":\"full\"}")
            echo "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('::notice::create',d.get('success'),d.get('errors'));print('::notice::NAMESERVERS',r.get('name_servers'),'STATUS',r.get('status'))"
          fi
