name: build-apk
on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', 'site/**', '.github/workflows/deploy-site.yml', '.github/workflows/d1-diag.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Signing key (from secret or repo)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/tahdir.keystore; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f app/tahdir.keystore ]; then
            gradle assembleRelease bundleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk tahdir.apk && cp app/build/outputs/bundle/release/app-release.aab tahdir.aab
          else
            echo "::warning::no signing key yet - building a debug APK (test only)"
            gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk tahdir.apk
          fi
          ls -la tahdir.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tahdir-apk
          path: |
            tahdir.apk
            tahdir.aab
      - name: Publish APK to the dist branch
        run: |
          mkdir -p /tmp/dist && cp tahdir.apk /tmp/dist/ && (cp tahdir.aab /tmp/dist/ 2>/dev/null || true) && echo "${{ github.sha }} run ${{ github.run_number }}" > /tmp/dist/BUILD.txt
          cd /tmp/dist && git init -q -b dist && git add . \
            && git -c user.name=build-bot -c user.email=build-bot@users.noreply.github.com commit -qm "APK build ${{ github.run_number }}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dist
