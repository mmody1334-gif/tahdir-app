name: grindmate-pages
# ينشر grindmate27/ على GitHub Pages — نفس الـ Action يكتب data/*.json
# والصفحة بتقرأها مباشرة، فالتحديث بيكون تلقائي مع كل run بتاع grindmate-update.
on:
  push:
    branches: [main]
    paths: ['grindmate27/**', '.github/workflows/grindmate-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: grindmate-pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './grindmate27'
      - id: deployment
        uses: actions/deploy-pages@v4
