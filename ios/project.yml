name: Tahdir
options:
  bundleIdPrefix: om.tahdir
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ar
targets:
  Tahdir:
    type: application
    platform: iOS
    sources:
      - path: Tahdir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: om.tahdir.app
        PRODUCT_NAME: Tahdir
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tahdir/Info.plist
