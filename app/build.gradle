plugins { id 'com.android.application' }

android {
    namespace 'om.tahdir.app'
    compileSdk 34
    defaultConfig {
        applicationId 'om.tahdir.app'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        release {
            storeFile file('tahdir.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'tahdir-app-2026'
            keyAlias 'tahdir'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'tahdir-app-2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
