plugins { id 'com.android.application' }

android {
    namespace 'om.tahdir.app'
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    flavorDimensions = ["brand"]
    productFlavors {
        kabsula {
            dimension "brand"
            applicationId 'om.tahdir.app'
            buildConfigField 'String', 'SITE_URL', '"https://elkabsula.site/"'
            buildConfigField 'String', 'APP_LABEL', '"الكبسولة"'
            buildConfigField 'String', 'TAB_COLOR', '"#0B3B33"'
            buildConfigField 'String', 'TAB_ACTIVE', '"#1F8A70"'
        }
        teqany {
            dimension "brand"
            applicationId 'om.tahdir.teqany'
            buildConfigField 'String', 'SITE_URL', '"https://tahdir.hudhaifa-bio.workers.dev/teqany"'
            buildConfigField 'String', 'APP_LABEL', '"تقني حذيفة"'
            buildConfigField 'String', 'TAB_COLOR', '"#1e3a8a"'
            buildConfigField 'String', 'TAB_ACTIVE', '"#2563eb"'
        }
    }
    signingConfigs {
        release {
            storeFile file('tahdir.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'tahdir-app-2026'
            keyAlias 'tahdir'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'tahdir-app-2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}
