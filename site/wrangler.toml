# نشر الموقع مع الأصول الثابتة (صور أسئلة الاختبارات النهائية)
name = "tahdir"
main = "dist/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "tahdir"
database_id = "43c1825c-d8d8-401a-a77b-2ec6897f457a"

[assets]
directory = "dist/assets"
binding = "ASSETS"

# ===== النطاق الخاص =====
# بعد شراء الدومين وإضافته كـ Zone في نفس حساب Cloudflare (وتغيير Name Servers
# عند المسجّل)، أزل التعليق عن السطرين المناسبين ثم ادفع — سينشئ Cloudflare
# سجل DNS والشهادة تلقائيًّا (custom_domain = true).
#
# routes = [
#   { pattern = "elkabsula.com", custom_domain = true },
#   { pattern = "www.elkabsula.com", custom_domain = true },
# ]